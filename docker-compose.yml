services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: purplle_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./app:/app
    environment:
      - DB_PATH=/data/store_intelligence.db
      - POS_CSV_PATH=/data/pos_transactions.csv
      - LOG_LEVEL=info
      - STORE_ID=STORE_BLR_002
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: purplle_dashboard
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
    driver: local
